litellm_settings:
  drop_params: true
  set_verbose: False
  json_logs: true
  request_timeout: 600
  extra_spend_tag_headers:
    - "x-custom-header"
  success_callback: ["langfuse"]
  failure_callback: ["langfuse"]
  # Optional callbacks — inert unless listed here (see litellm/Dockerfile for the deps,
  # docker-compose.yml for the volume mounts). Combine freely, e.g.:
  # callbacks: ["litellm_cost_callback.proxy_handler_instance", "ecologits_callback.proxy_handler_instance"]
  callbacks: ["litellm_cost_callback.proxy_handler_instance", "ecologits_callback.proxy_handler_instance"]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: false
  proxy_batch_write_at: 60
  database_connection_pool_limit: 10
  user_header_mappings:
    - header_name: X-OpenWebUI-User-Name
      litellm_user_role: internal_user
    - header_name: X-OpenWebUI-User-Email
      litellm_user_role: customer

